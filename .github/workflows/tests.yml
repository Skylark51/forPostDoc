name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - run: pytest -q
      - run: node --check docs/assets/si-docx.js
      - run: node --check docs/assets/si-generator.js
      - run: node --input-type=module -e "import('./docs/assets/si-docx.js').then(m=>{const d={name:'SI',absolute:{headers:['Structure'],rows:[]},relative:{headers:['Structure'],rows:[]},spin_density:{headers:['Structure'],rows:[]},geometry:{headers:['Structure'],rows:[]}};const b=m.buildDocxBytes(d);if(b[0]!==80||b[1]!==75)process.exit(1)})"
