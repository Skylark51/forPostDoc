[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "computational-chemistry-report-assistant"
version = "0.1.0"
description = "Project-first Gaussian calculation and report data manager"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "PySide6>=6.7",
  "pandas>=2.2",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "python-docx>=1.1",
]

[project.optional-dependencies]
google = [
  "google-api-python-client>=2.140",
  "google-auth>=2.34",
  "google-auth-oauthlib>=1.2",
]
dev = ["pytest>=8.3", "pytest-cov>=5.0"]

[project.scripts]
ccra = "ccra.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
